<!doctype html>
<!-- Source of public/og.png (1200x630). Regenerate with: npm run og -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Centered in a 900px page: npm run og renders 1200x900 and center-crops to 1200x630,
     because headless Chrome's viewport is shorter than its window size. */
  body { margin: 0; height: 900px; display: flex; align-items: center; }
  .og {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px 0;
    position: relative; display: flex; flex-direction: column; color: #1b1c1a;
    background-color: #f6f6f2;
    background-image: linear-gradient(#e7e7e0 1px, transparent 1px), linear-gradient(90deg, #e7e7e0 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .handle { margin: 0 0 40px; font-size: 24px; color: #55564f; }
  h1 { margin: 0 0 12px; font-weight: 700; font-size: 80px; line-height: 1.05; }
  .headline { margin: 0 0 40px; font-weight: 500; font-size: 32px; }
  .positioning { margin: 0; max-width: 960px; font-family: 'IBM Plex Sans', sans-serif; font-size: 32px; line-height: 1.35; color: #3d3e38; }
  .bottom { margin-top: auto; padding-bottom: 36px; display: flex; justify-content: space-between; align-items: center; font-size: 24px; }
  .domain { color: #2e6b5e; font-weight: 500; }
  .tile { display: inline-flex; width: 56px; height: 56px; border-radius: 10px; background: #1b1c1a; align-items: center; justify-content: center; font-weight: 700; color: #f6f6f2; }
  .tile span { color: #6fc7b4; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #2e6b5e; }
</style>
</head>
<body>
<div class="og">
  <p class="mono handle">~/norotaro</p>
  <h1 class="mono">Nelson Otazo</h1>
  <p class="mono headline">Senior Full-Stack Engineer · Laravel · Vue</p>
  <p class="positioning">I build and own production software end to end, including the AI parts.</p>
  <div class="mono bottom">
    <span class="domain">nelson.otazo.com.py</span>
    <span class="tile">&lt;<span>\</span>&gt;</span>
  </div>
  <div class="bar"></div>
</div>
</body>
</html>
